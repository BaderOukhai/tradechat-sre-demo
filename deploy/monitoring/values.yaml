# kube-prometheus-stack, trimmed for a laptop kind cluster.
# Kept: Prometheus, Alertmanager, Grafana, kube-state-metrics (pod readiness, restarts) and the
# kubelet/cAdvisor metrics (CPU and memory per container). Everything else is switched off.

defaultRules:
  create: false  # only our own alerts (tradechat chart, templates/alerts.yaml): no noise in the demo

# Control-plane components are not reachable for scraping in kind: they would show as "down".
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
nodeExporter:
  enabled: false  # node-level metrics are not used by the dashboard: saves one pod per node

prometheus:
  service:
    type: NodePort
    nodePort: 30090  # -> localhost:9090 (deploy/kind-config.yaml)
  prometheusSpec:
    # 15 s instead of the 30 s default: a pod kill must be visible within seconds on the dashboard.
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d  # local demo: two days of history is plenty
    # Pick up ServiceMonitors and PrometheusRules from any Helm release (our tradechat chart),
    # not only from this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi  # a few hundred series only; 1Gi leaves room for queries over 2 days

alertmanager:
  service:
    type: NodePort
    nodePort: 30093  # -> localhost:9093
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  defaultDashboardsEnabled: false  # only our "Messaging SLO" dashboard, shipped by the tradechat chart
  service:
    type: NodePort
    nodePort: 30300  # -> localhost:3000
  # Read-only anonymous access: the dashboard opens without a password during the demo.
  # Admin password: generated by the chart, stored in the "monitoring-grafana" Secret.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      searchNamespace: ALL  # the dashboard ConfigMap lives next to the app, in its own namespace
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi  # observed: OOMKilled at 256Mi during first-start database migrations
