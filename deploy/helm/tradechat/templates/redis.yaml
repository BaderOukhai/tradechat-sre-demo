apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1  # a single Redis: several would be separate databases, not replicas
  strategy:
    type: Recreate  # same volume constraint as the archiver
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # AOF: the stream (incl. messages not yet archived) survives a pod restart.
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          # No securityContext here: the official image starts as root to chown /data, then
          # drops to the "redis" user. In production: a hardened image that never runs as root.
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10    # a restart reloads the AOF: only after ~30 s of silence
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
        # Sidecar: same pod, so it reaches Redis on localhost. Measures the compliance gap at the
        # source (stream lag + pending), independently of the archiver it is meant to watch.
        - name: exporter
          image: {{ .Values.redis.exporter.image }}
          args: ["--redis.addr=redis://localhost:6379", "--check-streams=messages"]
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000  # the image's own non-root user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi  # a Go binary using ~10Mi: 64Mi is ample
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: metrics
      port: 9121
      targetPort: metrics
