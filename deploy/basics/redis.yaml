# Step 6a: the simplest possible Redis, to learn the building blocks.
# No persistence, probes or resources yet: the Helm chart (step 6b) adds them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1  # a single Redis: several would be separate databases, not replicas
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis  # becomes the DNS name "redis" inside the namespace
spec:
  selector:
    app: redis
  ports:
    - port: 6379
